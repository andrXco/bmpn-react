<div class="row justify-content-center">
  <div class="col-md-5">
    <h2>Iniciar sesión</h2>
    <p class="text-muted">Ingresa con el correo y la contraseña de tu usuario.</p>

    <app-mensaje-error [error]="error()"></app-mensaje-error>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username" />
        @if (campoInvalido(form.controls.email)) {
          <div class="text-danger small">Ingresa un correo válido.</div>
        }
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" type="password" class="form-control" formControlName="password"
          autocomplete="current-password" />
        @if (campoInvalido(form.controls.password)) {
          <div class="text-danger small">La contraseña es obligatoria.</div>
        }
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="estado() === 'loading'">
        {{ estado() === 'loading' ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="mt-3 text-muted">
      ¿Tu empresa aún no está registrada? <a routerLink="/empresas/registro">Registrar empresa</a>
    </p>
  </div>
</div>
