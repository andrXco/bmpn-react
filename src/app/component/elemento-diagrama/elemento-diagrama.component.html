<button type="button" class="elemento" [class.seleccionado]="seleccionado()"
  [title]="nodo().subtipo" (click)="seleccionar.emit(nodo())">
  @switch (nodo().tipo) {
    @case ('ACTIVIDAD') {
      <span class="actividad">{{ nodo().nombre }}</span>
    }
    @case ('GATEWAY') {
      <span class="rombo"></span>
      <span class="nombre">{{ nodo().nombre }}</span>
    }
    @case ('EVENTO') {
      <span class="circulo" [class.fin]="nodo().subtipo.startsWith('FIN')"
        [class.intermedio]="nodo().subtipo.startsWith('INTERMEDIO')"></span>
      <span class="nombre">{{ nodo().nombre }}</span>
    }
  }
  @if (nodo().advertencias.length > 0) {
    <span class="aviso">!</span>
  }
</button>
