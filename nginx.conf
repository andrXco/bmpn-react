server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Igual que proxy.conf.json en desarrollo: /api se reenvia al backend (servicio "app" del compose)
  location /api/ {
    proxy_pass http://app:8080;
  }

  # Rutas de Angular: si no es un archivo, se devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
